[project]
name = "mebelink"
version = "0.1"
description = "Mobile app for furniture management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=0.85.3",
    "pydantic==2.13.3",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["build/"]

[tool.ruff.lint]
extend-select = ["W293"]
