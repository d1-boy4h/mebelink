[project]
name = "mebelink"
version = "0.1"
description = "Mobile app for furniture management"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "buildozer>=1.6.0",
    "kivy>=2.3.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
[[tool.mypy.overrides]]
module = ['kivy.*']
ignore_missing_imports = true
